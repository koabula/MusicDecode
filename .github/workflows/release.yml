name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag matching the project, e.g. v1.1.0'
        type: string
        required: true
        default: v1.1.0
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    env:
      MUSICDECODE_TARGET: ${{ matrix.target }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      APPIMAGE_EXTRACT_AND_RUN: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libssl-dev
      - name: Install Windows audio compiler
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            make
            diffutils
      - run: npm ci
      - run: npm run check:version
      - name: Restore compiled audio component
        id: audio-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            src-tauri/binaries
            third-party/generated
            work/sources
          key: audio-v1-${{ matrix.target }}-${{ hashFiles('third-party/sources.json', 'scripts/build-ffmpeg.sh') }}
      - name: Download and verify audio sources
        run: npm run audio:sources
      - name: Build Windows audio sidecar
        if: runner.os == 'Windows' && steps.audio-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/build-ffmpeg.sh
      - name: Build macOS / Linux audio sidecar
        if: runner.os != 'Windows' && steps.audio-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/build-ffmpeg.sh
      - name: Cache verified audio component
        if: steps.audio-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            src-tauri/binaries
            third-party/generated
            work/sources
          key: audio-v1-${{ matrix.target }}-${{ hashFiles('third-party/sources.json', 'scripts/build-ffmpeg.sh') }}
      - name: Resolve locked Rust dependencies
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - name: Generate license notices
        run: node scripts/notices.mjs
      - name: Build frontend for core test context
        run: npm run build
      - name: Test decoding and transcoding with generated audio
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} -- --nocapture
      - name: Build platform installer
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          uploadUpdaterJson: false
      - name: Verify macOS application signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          images=(src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          test -f "${images[0]}"
          mountpoint="$RUNNER_TEMP/musicdecode-signature-check"
          mkdir -p "$mountpoint"
          hdiutil attach "${images[0]}" -readonly -nobrowse -mountpoint "$mountpoint"
          trap 'hdiutil detach "$mountpoint" -quiet' EXIT
          codesign --verify --deep --strict --verbose=2 "$mountpoint/MusicDecode.app"
          file "$mountpoint/MusicDecode.app/Contents/MacOS/MusicDecode" | grep arm64
          "$mountpoint/MusicDecode.app/Contents/MacOS/musicdecode-ffmpeg" -version
      - name: Collect installers, source archives and checksums
        run: node scripts/collect-artifacts.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
  publish:
    name: Publish all three platforms
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: packages-*
          path: release-assets
          merge-multiple: true
      - name: Verify checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS-*.txt
      - name: Publish complete release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          NOTES="docs/releases/$RELEASE_TAG.md"
          test -f "$NOTES"
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > existing-release.txt 2>/dev/null; then
            test "$(cat existing-release.txt)" = true || { echo 'Refusing to replace an already published release'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "MusicDecode $RELEASE_TAG" --notes-file "$NOTES" --draft
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
