[package]
name = "musicdecode"
version = "1.1.0"
description = "A simple, offline NCM to MP3 desktop tool"
edition = "2021"
license = "MIT"
repository = "https://github.com/koabula/MusicDecode"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes = "0.8"
base64 = "0.22"
id3 = "1"
tempfile = "3"
rfd = "0.15"

[dev-dependencies]
sha2 = "0.10"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
